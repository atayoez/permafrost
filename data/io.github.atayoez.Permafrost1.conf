<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the service, running as root, may own the name. -->
  <policy user="root">
    <allow own="io.github.atayoez.Permafrost1"/>
  </policy>

  <!-- Anyone may call it; the service itself refuses anything that loosens a lock. -->
  <policy context="default">
    <allow send_destination="io.github.atayoez.Permafrost1"/>
  </policy>
</busconfig>
