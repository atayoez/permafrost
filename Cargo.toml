[workspace]
resolver = "3"
members = ["crates/common", "crates/daemon", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Atay Özcan <atayozcan160@gmail.com>"]
repository = "https://github.com/atayoez/permafrost"

[workspace.dependencies]
permafrost-common = { path = "crates/common" }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zbus = "5.19.0"
