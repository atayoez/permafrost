[package]
name = "permafrost"
description = "Block distracting websites and apps until the timer runs out"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
permafrost-common.workspace = true
chrono.workspace = true
serde_json.workspace = true
zbus.workspace = true
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "background"] }
futures-util = "0.3.34"
gio-unix = "0.22.8"

[build-dependencies]
glib-build-tools = "0.22.8"
